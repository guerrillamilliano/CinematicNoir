# Cinematic Noir. PLAY: a hardware screen (category row, the preset with its arrows, the waveform of the sound with a
# playhead and a TRIG lamp, the sound's character and details, what is playing), then the 16 Q-Link knobs.
# TUNE: pitch, envelope, voice and the sound browser. FX (last): Cracked Vinyl, M/S Stereo, Spit & Grit Squash, Tape Filter.
# MOOD: Tone (tilt, warmth, air), Shadow & Shimmer (octave ghost tails), Noir Echo, Motion (ensemble, pulse).
# The waveform: 40 column pictures (w00..w39, art/wv_NN.png) and a playhead picture over them (wave_head, art/head_NN.png),
# all drawn by art/make_wave_art.py and moved by the engine (HAS_DISPLAY_REV). A knob's touch box runs from r+5 above its
# centre to about r+59+text below; everything stays within y=86..714 (the 628 px area).
