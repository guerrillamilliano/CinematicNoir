  <rect x="4" y="4" width="462" height="40" rx="3" fill="url(#p)"/>
  <rect x="4" y="4" width="462" height="40" rx="3" fill="none" stroke="#000000" stroke-opacity="0.85" stroke-width="3"/>
  <polygon points="4,4 156,4 117,44 4,44" fill="#ffffff" fill-opacity="0.035"/>
