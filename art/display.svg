<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="338" viewBox="0 0 1240 338">
  <!-- The PLAY tab's hardware screen: a gunmetal bezel with screws, a recessed amber dot-matrix screen behind glass.
       Placed at layout x=20 y=150; the window is y 8..330. Rows (layout y): bank 178, program 226, waveform 262..346
       (x 150..1150, TRIG lamp at 1184,300), sound 370, info 402, play 442. The live parts sit on it (layout.conf). -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2e"/>
      <stop offset="0.5" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#0e0e0f"/>
    </linearGradient>
    <pattern id="brush" width="240" height="2" patternUnits="userSpaceOnUse">
      <rect width="240" height="1" fill="#ffffff" fill-opacity="0.018"/>
      <rect x="37" width="90" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1307"/>
      <stop offset="0.5" stop-color="#140d05"/>
      <stop offset="1" stop-color="#0c0803"/>
    </linearGradient>
    <radialGradient id="backlight" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#ff9d2e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="pixels" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#ffb547" fill-opacity="0.045"/>
    </pattern>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="screwhead" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8d8d92"/>
      <stop offset="0.55" stop-color="#4a4a4f"/>
      <stop offset="1" stop-color="#1c1c1f"/>
    </radialGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a6"/>
      <stop offset="0.45" stop-color="#ffab33"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="screw">
      <circle r="6.5" fill="#050505" fill-opacity="0.7"/>
      <circle r="5.5" fill="url(#screwhead)" stroke="#0a0a0b" stroke-width="0.8"/>
      <path d="M -3.2 0 H 3.2 M 0 -3.2 V 3.2" stroke="#161618" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -3 0.6 H 3 M 0.6 -3 V 3" stroke="#9a9aa0" stroke-opacity="0.35" stroke-width="0.6"/>
    </g>
  </defs>

  <!-- bezel -->
  <rect x="3" y="5" width="1236" height="332" rx="12" fill="#000000" fill-opacity="0.6" filter="url(#soft)"/>
  <rect x="1" y="1" width="1238" height="334" rx="11" fill="url(#metal)"/>
  <rect x="1" y="1" width="1238" height="334" rx="11" fill="url(#brush)"/>
  <path d="M 12 1.5 H 1228 Q 1238.5 1.5 1238.5 12" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>
  <path d="M 1.5 324 V 12 Q 1.5 1.5 12 1.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.2"/>
  <path d="M 1238.5 12 V 324 Q 1238.5 334.5 1228 334.5 H 12 Q 1.5 334.5 1.5 324" fill="none" stroke="#000000" stroke-opacity="0.8" stroke-width="1.5"/>
  <use href="#screw" x="11" y="20"/>
  <use href="#screw" x="11" y="316"/>
  <use href="#screw" x="1229" y="20"/>
  <use href="#screw" x="1229" y="316"/>

  <!-- the window -->
  <rect x="20" y="6" width="1200" height="326" rx="5" fill="#000000"/>
  <rect x="22" y="8" width="1196" height="322" rx="4" fill="url(#screen)"/>
  <rect x="22" y="8" width="1196" height="322" rx="4" fill="url(#backlight)"/>
  <rect x="22" y="8" width="1196" height="322" rx="4" fill="url(#pixels)"/>
  <rect x="22" y="8" width="1196" height="322" rx="4" fill="url(#scan)"/>
  <rect x="22" y="8" width="1196" height="322" rx="4" fill="url(#vignette)"/>
  <rect x="22" y="8" width="1196" height="322" rx="4" fill="none" stroke="#000000" stroke-opacity="0.9" stroke-width="5"/>
  <path d="M 21 331.5 H 1219.5 V 7" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- the waveform well: darker glass, a centre line, a time grid -->
  <rect x="128" y="110" width="1004" height="88" rx="3" fill="#000000" fill-opacity="0.35" stroke="#b07a2e" stroke-opacity="0.25"/>
  <line x1="130" y1="154" x2="1130" y2="154" stroke="#b07a2e" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3"/>
  <g stroke="#b07a2e" stroke-opacity="0.18" stroke-width="1">
    <line x1="230" y1="112" x2="230" y2="196"/><line x1="330" y1="112" x2="330" y2="196"/><line x1="430" y1="112" x2="430" y2="196"/>
    <line x1="530" y1="112" x2="530" y2="196"/><line x1="630" y1="112" x2="630" y2="196"/><line x1="730" y1="112" x2="730" y2="196"/>
    <line x1="830" y1="112" x2="830" y2="196"/><line x1="930" y1="112" x2="930" y2="196"/><line x1="1030" y1="112" x2="1030" y2="196"/>
  </g>

  <!-- screen UI: legends and dotted rules in dim amber -->
  <g font-family="Titillium Web" font-weight="600" font-size="16" letter-spacing="2" fill="#c89442" fill-opacity="0.95">
    <text x="38" y="33">BANK</text>
    <text x="38" y="81">PROGRAM</text>
    <text x="38" y="159">WAVE</text>
    <text x="38" y="225">SOUND</text>
    <text x="38" y="257">INFO</text>
    <text x="38" y="297">PLAY</text>
    <text x="1164" y="188" text-anchor="middle" font-size="14">TRIG</text>
  </g>
  <g stroke="#b07a2e" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 3">
    <line x1="38" y1="48" x2="1200" y2="48"/>
    <line x1="38" y1="105" x2="1200" y2="105"/>
    <line x1="38" y1="204" x2="1200" y2="204"/>
    <line x1="38" y1="272" x2="1200" y2="272"/>
  </g>
  <circle cx="1164" cy="150" r="20" fill="none" stroke="#b07a2e" stroke-opacity="0.35"/>

  <!-- glass -->
  <polygon points="22,8 560,8 320,330 22,330" fill="url(#reflect)"/>
  <rect x="24" y="9" width="1192" height="1" fill="#ffffff" fill-opacity="0.10"/>

  <!-- power LED and engraving on the bezel -->
  <circle cx="1229" cy="168" r="7" fill="url(#led)" fill-opacity="0.55"/>
  <circle cx="1229" cy="168" r="2.4" fill="#ffd27a"/>
  <g transform="translate(8 168) rotate(-90)">
    <text text-anchor="middle" y="2" font-family="Titillium Web" font-weight="600" font-size="7.5" letter-spacing="2.2" fill="#000000" fill-opacity="0.6">NOIR</text>
    <text text-anchor="middle" y="1.2" font-family="Titillium Web" font-weight="600" font-size="7.5" letter-spacing="2.2" fill="#8a8a90" fill-opacity="0.7">NOIR</text>
  </g>
</svg>
